version: 0.2

env:
  variables:
    AWS_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "406005162296"
    BACKEND_ECR_URI: "406005162296.dkr.ecr.us-east-1.amazonaws.com/auto-blog-backend"
    FRONTEND_ECR_URI: "406005162296.dkr.ecr.us-east-1.amazonaws.com/auto-blog-frontend"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing Docker Compose..."
      - curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
      - chmod +x /usr/local/bin/docker-compose
      - docker-compose version

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

  build:
    commands:
      - echo "Building backend..."
      - cd backend
      - npm ci
      - echo "Building backend Docker image..."
      - docker build -t blog-backend .
      - docker tag blog-backend:latest ${BACKEND_ECR_URI}:latest
      - cd ..
      
      - echo "Building frontend..."
      - cd frontend
      - npm ci
      - echo "Building frontend Docker image..."
      - docker build --build-arg VITE_API_URL=http://13.60.75.58:3001/api -t blog-frontend .
      - docker tag blog-frontend:latest ${FRONTEND_ECR_URI}:latest
      - cd ..

  post_build:
    commands:
      - echo "Pushing images to ECR..."
      - docker push ${BACKEND_ECR_URI}:latest
      - docker push ${FRONTEND_ECR_URI}:latest
      - echo "Build completed on $(date)"

artifacts:
  files:
    - '**/*'